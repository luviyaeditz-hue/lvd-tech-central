<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBL Sound - LVD Tech Central</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0f14;
            color: #ffffff;
            overflow-x: hidden;
        }

        .header-section {
            text-align: center;
            padding: 30px 20px;
            background: #121218;
            border-bottom: 1px solid #2a2a36;
        }

        .store-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 20px;
            transition: all 0.3s ease;
            margin: 0 2px;
        }

        .navbar a:hover, .navbar a.active {
            background-color: #0071e3;
        }

        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .section-heading {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .cards-grid {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .item-card {
            background: rgba(28, 28, 36, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 20px;
            width: 300px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-8px);
            border-color: #0071e3;
        }

        .item-card h3 {
            font-size: 1.3rem;
            color: #00d2ff;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .item-card p {
            color: #a0a0b0;
            font-size: 1rem;
        }

        footer {
            background-color: #08080c;
            border-top: 1px solid #1a1a24;
            padding: 40px 20px;
            text-align: center;
            color: #6e6e73;
            font-size: 0.85rem;
            margin-top: 80px;
        }

        footer span {
            color: #0071e3;
            font-weight: 600;
        }
    </style>
</head>

            <a href="watches.html">Watches</a>
            <a href="pendrives.html">Pen Drives</a>
            <a href="jbl-sound.html" class="active">JBL Sound</a>
            <a href="computers.html">Computers</a>
            <a href="accessories.html">Accessories</a>
        </nav>
    </div>

    <div class="container">
        <h2 class="section-heading">JBL Sound Collection</h2>
        
        <div class="cards-grid">
            <div class="item-card">
                <h3>New Stock</h3>
                <p>Updating Soon...</p>
            </div>
            <div class="item-card">
                <h3>New Stock</h3>
                <p>Updating Soon...</p>
            </div>
            <div class="item-card">
                <h3>New Stock</h3>
                <p>Updating Soon...</p>
            </div>
        </div>
    </div>

    <footer>

    </footer>

</body>
</html>
